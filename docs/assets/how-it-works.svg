<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-label="How Video Trimmer works: open a video, drag the IN and OUT handles, save the clip. Everything runs on your PC.">
<rect width="1200" height="372" fill="#0E2A2F"/>
<text x="36" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="800" fill="#F3E9D2" text-anchor="start" >Everything runs on your PC — <tspan fill="#FF7A1A">your video never leaves it</tspan></text>
<rect x="36" y="70" width="356" height="220" rx="6" fill="#16393F"/>
<text x="56" y="108" font-family="Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#FF7A1A" text-anchor="start" >1</text>
<text x="88" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#F3E9D2" text-anchor="start" >Open a video</text>
<text x="56" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#F3E9D2" text-anchor="start" >Thumbnail timeline appears</text>
<text x="56" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#6FA3A0" text-anchor="start" >Ctrl+O, or drag the file in</text>
<rect x="422" y="70" width="356" height="220" rx="6" fill="#16393F"/>
<text x="442" y="108" font-family="Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#FF7A1A" text-anchor="start" >2</text>
<text x="474" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#F3E9D2" text-anchor="start" >Mark IN and OUT</text>
<text x="442" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#F3E9D2" text-anchor="start" >Drag the IN / OUT handles</text>
<text x="442" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#6FA3A0" text-anchor="start" >Frame-accurate preview</text>
<rect x="808" y="70" width="356" height="220" rx="6" fill="#16393F"/>
<text x="828" y="108" font-family="Consolas,'Courier New',monospace" font-size="30" font-weight="700" fill="#FF7A1A" text-anchor="start" >3</text>
<text x="860" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#F3E9D2" text-anchor="start" >Save the clip</text>
<text x="828" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#F3E9D2" text-anchor="start" >Copy: fast, no re-encode</text>
<text x="828" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#6FA3A0" text-anchor="start" >Or re-encode to change format</text>
